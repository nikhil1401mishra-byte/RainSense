[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rainsense"
version = "1.0.0"
description = "RainSense weather dashboard and ML rain prediction API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "joblib==1.4.2",
  "scikit-learn==1.6.1",
  "pandas==2.2.3",
  "numpy==2.1.3",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.setuptools.packages.find]
include = ["backend*"]
